<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enzo Mixology - 酒鬼虾条摸底</title>
    <style>
        :root { --main: #1a1a1a; --gold: #d4af37; --bg: #f8f8f8; }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--main); max-width: 650px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        h1 { border-left: 6px solid var(--gold); padding-left: 15px; font-size: 1.6rem; margin-bottom: 30px; }
        .q-card { background: #fff; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .q-text { font-weight: 600; margin-bottom: 15px; display: block; font-size: 1.05rem; }
        .slider-box { display: flex; align-items: center; gap: 15px; background: #fdfdfd; padding: 10px; border-radius: 8px; }
        input[type=range] { flex: 1; accent-color: var(--gold); cursor: pointer; }
        .val-num { width: 45px; font-weight: bold; color: var(--gold); text-align: center; font-size: 1.2rem; }
        .btn-group { display: flex; gap: 12px; }
        .yn-btn { flex: 1; padding: 12px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 6px; }
        .yn-btn.active { background: var(--main); color: var(--gold); border-color: var(--main); font-weight: bold; }
        #score-board { position: sticky; bottom: 20px; background: var(--main); color: white; padding: 25px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 100; }
        .weight-tag { font-size: 11px; color: #aaa; margin-left: 10px; font-weight: normal; }
    </style>
    <meta name="description" content="Enzo Mixology 的调酒知识自评：10 道题，滑块与是非选择，实时加权百分制计分。">
    <link rel="canonical" href="https://rqguan.github.io/bartending/cocktailtest/">
    <link rel="stylesheet" href="../assets/quiz.css">
</head>
<body>
    <nav aria-label="返回导航" id="top-nav" class="quiz-nav"><a class="back-link" href="../" id="back-link">← Enzo Mixology · 返回主页</a><button type="button" class="lang-toggle" id="lang-toggle" onclick="toggleLang()" aria-label="Switch to English" lang="en">EN</button></nav>
    <main>

    <h1>ENZO MIXOLOGY<br><small style="font-size: 0.9rem; color: #666; font-weight: normal;" id="subtitle">酒鬼虾条摸底</small></h1>

    <p class="quiz-intro" id="intro">十道题，看看你的饮品知识从哪里开始。拖动滑块或选择答案，分数会实时更新。</p>
    <div id="quiz"></div>
    <noscript><p>此测验需要启用 JavaScript 才能显示题目并计算分数。<span lang="en">This quiz needs JavaScript to show the questions and calculate your score.</span></p></noscript>

    <div id="score-board" role="status" aria-live="polite" aria-atomic="true">
        <div style="font-size: 0.9rem; margin-bottom: 5px; color: #ccc;" id="score-label">百分制综合评价</div>
        <div>
            <span id="total" style="font-size: 3rem; color: var(--gold); font-weight: bold;">0</span>
            <span style="font-size: 1.2rem; color: var(--gold);">%</span>
        </div>
    </div>

    </main>
    <script>
        const questions = [
            { t: "1. 六大基酒，你能说出几个?", min: 0, max: 6, w: 10, type: 'scale' },
            { t: "2. 六大基酒各列出一杯经典鸡尾酒，你能列出几杯?", min: 0, max: 6, w: 10, type: 'scale' },
            { t: "3. 是否知道味美思基酒的农作物来源?", min: 0, max: 1, w: 5, type: 'yn' },
            { t: "4. 你能列举出几种澄清（Clarification）的方法?", min: 0, max: 5, w: 5, type: 'scale' },
            { t: "5. 你能列出几种酿造葡萄酒的葡萄品种?", min: 0, max: 5, w: 5, type: 'scale' },
            { t: "6. 你是否知道精米步合度是什么?", min: 0, max: 1, w: 3, type: 'yn' },
            { t: "7. 你大致能说出多少种酒的品牌（商标名）?", min: 0, max: 10, w: 5, type: 'scale' },
            { t: "8. 你能说出几种带气泡的酒的种类?（分类越细越好）", min: 0, max: 10, w: 5, type: 'scale' },
            { t: "9. 你能说出几种杯型的名字?", min: 0, max: 5, w: 8, type: 'scale' },
            { t: "10. 花/果/木/草/烟熏的风味，各列一种酒名（商标名），你能列出几个?", min: 0, max: 5, w: 5, type: 'scale' }
        ];

        // English wording for each question, in the same order as `questions`; data and scoring stay in `questions`.
        const questionsEn = [
            "1. How many of the six base spirits can you name?",
            "2. Name one classic cocktail for each of the six base spirits. How many can you list?",
            "3. Do you know which crop vermouth's base wine comes from?",
            "4. How many clarification methods can you name?",
            "5. How many grape varieties used to make wine can you name?",
            "6. Do you know what seimaibuai (rice polishing ratio) means?",
            "7. Roughly how many alcohol brands (trademarks) can you name?",
            "8. How many types of sparkling alcoholic drinks can you name? (The finer the categories, the better.)",
            "9. How many glassware types can you name?",
            "10. Name one bottle (brand name) each for floral, fruity, woody, herbal and smoky flavors. How many can you list?"
        ];

        const i18n = {
            zh: { title: 'Enzo Mixology - 酒鬼虾条摸底', subtitle: '酒鬼虾条摸底', intro: '十道题，看看你的饮品知识从哪里开始。拖动滑块或选择答案，分数会实时更新。', back: '← Enzo Mixology · 返回主页', nav: '返回导航', score: '百分制综合评价', yes: '知道 (10分)', no: '不知道 (0分)', toggle: 'EN', toggleLabel: 'Switch to English', toggleLang: 'en', htmlLang: 'zh-CN' },
            en: { title: 'Enzo Mixology - Cocktail Knowledge Check', subtitle: 'Cocktail Knowledge Check', intro: 'Ten questions to see where your drinks knowledge starts. Drag a slider or pick an answer; your score updates as you go.', back: '← Enzo Mixology · Back to home', nav: 'Back navigation', score: 'Overall score (out of 100)', yes: 'I know (10 pts)', no: "I don't know (0 pts)", toggle: '中文', toggleLabel: '切换到中文', toggleLang: 'zh-CN', htmlLang: 'en' }
        };

        function initialLang() {
            try {
                const fromUrl = new URLSearchParams(location.search).get('lang');
                if (fromUrl === 'en' || fromUrl === 'zh') return fromUrl;
                const site = localStorage.getItem('site-lang');
                if (site === 'en' || site === 'zh') return site;
                const saved = localStorage.getItem('cocktailtest-lang');
                if (saved === 'en' || saved === 'zh') return saved;
            } catch (e) {}
            return 'zh';
        }
        let lang = initialLang();

        // 理论最高加权总分 = 总权重和 * 10
        const totalWeight = questions.reduce((sum, q) => sum + q.w, 0);
        const maxScore = totalWeight * 10;
        let state = questions.map(q => 0);

        function render() {
            const container = document.getElementById('quiz');
            const L = i18n[lang];
            container.innerHTML = '';
            questions.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'q-card';
                let html = `<label class="q-text" id="question-${i}" ${q.type === 'scale' ? `for="answer-${i}"` : ''}>${lang === 'en' ? questionsEn[i] : q.t}<span class="weight-tag">Weight: ${q.w}</span></label>`;
                
                if (q.type === 'scale') {
                    html += `
                        <div class="slider-box">
                            <span style="font-size: 12px; color:#999">${q.min}</span>
                            <input id="answer-${i}" aria-labelledby="question-${i}" type="range" min="${q.min}" max="${q.max}" value="${state[i]}" step="1" oninput="update(${i}, this.value)">
                            <span style="font-size: 12px; color:#999">${q.max}</span>
                            <div class="val-num" id="val-${i}">${state[i]}</div>
                        </div>`;
                } else {
                    html += `
                        <div class="btn-group" role="group" aria-labelledby="question-${i}">
                            <button type="button" aria-pressed="${state[i] === 1}" class="yn-btn${state[i] === 1 ? ' active' : ''}" id="yn-${i}-1" onclick="update(${i}, 1)">${L.yes}</button>
                            <button type="button" aria-pressed="${state[i] === 0}" class="yn-btn${state[i] === 0 ? ' active' : ''}" id="yn-${i}-0" onclick="update(${i}, 0)">${L.no}</button>
                        </div>`;
                }
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        window.update = (index, val) => {
            state[index] = parseFloat(val);
            if (questions[index].type === 'scale') {
                document.getElementById(`val-${index}`).innerText = val;
            } else {
                document.querySelectorAll(`#yn-${index}-1, #yn-${index}-0`).forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
                document.getElementById(`yn-${index}-${val}`).classList.add('active');
                document.getElementById(`yn-${index}-${val}`).setAttribute('aria-pressed', 'true');
            }
            calculate();
        };

        function calculate() {
            let weightedTotal = 0;
            questions.forEach((q, i) => {
                // 每道题先折算成10分满分制： (当前值 / 最大值) * 10
                const scoreOutOfTen = (state[i] / q.max) * 10;
                // 再乘以该题权重
                weightedTotal += scoreOutOfTen * q.w;
            });
            // 换算百分制：(实际加权总分 / 理论加权总分) * 100
            const percentage = Math.round((weightedTotal / maxScore) * 100);
            document.getElementById('total').innerText = percentage;
        }

        function applyLang() {
            const L = i18n[lang];
            if (document.documentElement) document.documentElement.lang = L.htmlLang;
            document.title = L.title;
            [['subtitle', L.subtitle], ['intro', L.intro], ['back-link', L.back], ['score-label', L.score], ['lang-toggle', L.toggle]]
                .forEach(([id, text]) => { const el = document.getElementById(id); if (el) el.textContent = text; });
            const nav = document.getElementById('top-nav');
            if (nav) nav.setAttribute('aria-label', L.nav);
            const btn = document.getElementById('lang-toggle');
            if (btn) { btn.setAttribute('aria-label', L.toggleLabel); btn.setAttribute('lang', L.toggleLang); }
            // Share the language with the rest of the site, and keep it when going back to the homepage.
            try { localStorage.setItem('site-lang', lang); localStorage.setItem('cocktailtest-lang', lang); } catch (e) {}
            const back = document.getElementById('back-link');
            if (back) back.setAttribute('href', lang === 'zh' ? '../?lang=zh' : '../');
            render();
        }

        window.toggleLang = () => {
            lang = lang === 'zh' ? 'en' : 'zh';
            try {
                localStorage.setItem('cocktailtest-lang', lang);
                const url = new URL(location.href);
                if (lang === 'en') url.searchParams.set('lang', 'en'); else url.searchParams.delete('lang');
                history.replaceState(null, '', url);
            } catch (e) {}
            applyLang();
        };

        applyLang();
    </script>
</body>
</html>
