<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="150" height="150" viewBox="0 0 150 150">
  <!-- Halloween night: lanterns, bats, stars -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .glow { animation: glow 2.6s ease-in-out infinite; }
      .g2 { animation-delay: 1.3s; }
      @keyframes glow { 0%, 100% { opacity: .9; } 45% { opacity: .55; } 55% { opacity: .95; } }
    }
  </style>
  <defs>
    <g id="lantern">
      <path d="M-1.5 -11h3v4h-3z" fill="#3d2a14"/>
      <ellipse cx="0" cy="0" rx="12" ry="9.5" fill="#9a4d12"/>
      <ellipse cx="-5" cy="0" rx="4.5" ry="9" fill="#8a4410"/>
      <ellipse cx="5" cy="0" rx="4.5" ry="9" fill="#8a4410"/>
      <g class="glow" fill="#ffb347">
        <path d="M-7 -3l3-3 3 3z"/><path d="M1 -3l3-3 3 3z"/>
        <path d="M-7 2q7 6 14 0q-2 1-3 0-1 2-2 0-2 2-3 0-1 2-2 0-2 1-4 0z"/>
      </g>
    </g>
    <path id="bat" d="M0 0q-3-4-8-3 2 2 1 4-3-1-6 1 4 1 5 4 2-3 5-2 1 2 3 1 2 1 3-1 3-1 5 2 1-3 5-4-3-2-6-1-1-2 1-4-5-1-8 3z" fill="#120a1a"/>
  </defs>
  <rect width="150" height="150" fill="#24142e"/>
  <g fill="#e9dcff">
    <circle cx="14" cy="20" r=".8" opacity=".7"/><circle cx="58" cy="10" r=".6" opacity=".5"/><circle cx="96" cy="34" r=".9" opacity=".8"/>
    <circle cx="136" cy="16" r=".7" opacity=".6"/><circle cx="20" cy="88" r=".6" opacity=".5"/><circle cx="70" cy="126" r=".8" opacity=".7"/>
    <circle cx="128" cy="96" r=".7" opacity=".6"/><circle cx="104" cy="140" r=".6" opacity=".5"/><circle cx="44" cy="58" r=".5" opacity=".5"/>
  </g>
  <use xlink:href="#lantern" x="38" y="112"/>
  <use xlink:href="#lantern" x="112" y="38" class="g2"/>
  <use xlink:href="#bat" x="86" y="84" transform="rotate(-8 86 84)" opacity=".85"/>
  <use xlink:href="#bat" x="24" y="34" transform="scale(.7) translate(10 10)" opacity=".8"/>
</svg>
